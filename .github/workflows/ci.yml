name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, migrations, evals)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: medguard
          POSTGRES_PASSWORD: medguard
          POSTGRES_DB: medguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit and API tests (Claude is faked; no API key needed)
        run: python -m pytest -q

      - name: Migrations apply on Postgres and match the models
        env:
          DATABASE_URL: postgresql://medguard:medguard@localhost:5432/medguard
        run: |
          alembic upgrade head
          alembic check

      - name: Legacy Streamlit evals
        working-directory: .
        run: python evals/run_evals.py

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Route types (LayoutProps etc.) are generated by Next; create them before tsc.
      - run: npm run typecheck
      - run: npm run build
