# Render Blueprint for the MedGuard API and Redis (Key Value). Free plans only.
# Postgres is on Neon's free tier (no 30-day expiry); the web app is on Vercel.
# See DEPLOY.md.
#
# Validate before use:  render blueprints validate render.yaml

services:
  - type: web
    name: medguard-routines-api
    runtime: python
    rootDir: backend
    region: singapore
    # Free instances sleep after ~15 min idle; the first request then takes ~1 min.
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run on start because pre-deploy commands need a paid plan.
    startCommand: >-
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    # Deploy only after GitHub Actions CI passes on main.
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: MEDGUARD_ENV
        value: production
      - key: MEDGUARD_LLM_PROVIDER
        value: gemini
      - key: MEDGUARD_ROUTINE_PLANNER
        value: scheduler
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: medguard-redis
          property: connectionString
      # Secrets: Render asks for these when the Blueprint is first created.
      # Neon pooled connection string (hostname has -pooler), for app traffic.
      - key: DATABASE_URL
        sync: false
      # Neon direct connection string (no -pooler), used by `alembic upgrade head`.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # From Google AI Studio (aistudio.google.com/apikey).
      - key: GEMINI_API_KEY
        sync: false
      # The web app's public origin, e.g. https://medguard-rose.vercel.app (comma-separate several).
      - key: MEDGUARD_CORS_ORIGINS
        sync: false

  - type: keyvalue
    name: medguard-redis
    region: singapore
    plan: free
    # Empty list = no connections from outside Render; the API connects over the private network.
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
